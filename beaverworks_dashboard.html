<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦫 비버웍스 영업본부 | 매출현황 대시보드 v2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --primary:#1a3c5e;--accent:#e8a020;--success:#2ecc71;--danger:#e74c3c;
  --light-bg:#f0f4f8;--card-bg:#fff;--border:#dde3ed;--text:#2c3e50;--muted:#7f8c8d;
  --blue:#2980b9;--green:#27ae60;--orange:#e67e22;--purple:#8e44ad;--red:#e74c3c;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'맑은 고딕','Apple SD Gothic Neo',Arial,sans-serif;background:var(--light-bg);color:var(--text);font-size:13px;}
header{background:var(--primary);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25);}
header h1{font-size:16px;font-weight:700;letter-spacing:-.3px;}
.header-meta{font-size:11px;color:#adc6e0;}
.upload-zone{background:#fff;border:2.5px dashed var(--accent);border-radius:12px;padding:28px 20px;text-align:center;margin:16px 24px;cursor:pointer;transition:background .2s;}
.upload-zone:hover{background:#fffbf0;}
.upload-zone .icon{font-size:36px;}
.upload-zone p{margin:6px 0 3px;font-weight:600;color:var(--primary);font-size:14px;}
.upload-zone small{color:var(--muted);}
.upload-zone input{display:none;}
#file-status{margin:4px 24px 0;font-size:12px;color:var(--success);font-weight:600;}
.tabs{display:flex;gap:4px;padding:0 24px;border-bottom:2px solid var(--border);margin-top:8px;overflow-x:auto;}
.tab{padding:9px 16px;border-radius:8px 8px 0 0;cursor:pointer;font-weight:600;font-size:12px;color:var(--muted);border:2px solid transparent;border-bottom:none;background:#e8edf3;transition:all .2s;white-space:nowrap;}
.tab.active{background:var(--card-bg);color:var(--primary);border-color:var(--border);border-bottom-color:#fff;margin-bottom:-2px;}
.tab:hover:not(.active){background:#dde3ed;}
.page{display:none;padding:18px 24px;}
.page.active{display:block;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px;}
.kpi-card{background:var(--card-bg);border-radius:10px;padding:14px;border-left:4px solid var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.07);}
.kpi-card.blue{border-left-color:var(--blue);}
.kpi-card.green{border-left-color:var(--green);}
.kpi-card.orange{border-left-color:var(--orange);}
.kpi-card.purple{border-left-color:var(--purple);}
.kpi-card.red{border-left-color:var(--red);}
.kpi-card.teal{border-left-color:#16a085;}
.kpi-card .lbl{font-size:10px;color:var(--muted);font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.kpi-card .val{font-size:19px;font-weight:700;color:var(--text);}
.kpi-card .sub{font-size:10px;color:var(--muted);margin-top:2px;}
.section-title{font-size:13px;font-weight:700;color:var(--primary);background:#ebf5fb;padding:8px 12px;border-left:3px solid var(--blue);margin:16px 0 10px;border-radius:0 4px 4px 0;}
.table-wrap{overflow-x:auto;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:16px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:#2c3e50;color:#fff;padding:9px 10px;font-weight:600;text-align:center;white-space:nowrap;}
th.blue-hdr{background:#2980b9;}
th.green-hdr{background:#27ae60;}
th.orange-hdr{background:#e67e22;}
td{padding:7px 10px;border-bottom:1px solid #eef0f3;vertical-align:middle;}
tr:nth-child(even) td{background:#f9fbfd;}
tr:hover td{background:#f0f4f8;}
tr.subtotal td{background:#f4ecf7;font-weight:700;}
tr.total td{background:#d5e8d4;font-weight:700;}
.text-center{text-align:center;}
.text-right{text-align:right;}
.text-left{text-align:left;}
.num{text-align:right;font-family:monospace;}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}
.badge-미확인{background:#fdebd0;color:#d35400;}
.badge-불출중{background:#d6eaf8;color:#1a5276;}
.badge-불출완료{background:#d5f5e3;color:#1e8449;}
.badge-설치완료{background:#e8daef;color:#6c3483;}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
.chart-card{background:var(--card-bg);border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.chart-card h3{font-size:12px;font-weight:700;color:var(--primary);margin-bottom:10px;}
.legend-bar{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;}
.legend-item{display:flex;align-items:center;font-size:11px;color:var(--muted);}
.filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.filter-bar label{font-weight:600;font-size:12px;}
.filter-bar input,.filter-bar select{padding:5px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;}
/* 목표달성 게이지 */
.goal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px;}
.goal-card{background:var(--card-bg);border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.goal-card .team-name{font-size:13px;font-weight:700;margin-bottom:8px;}
.goal-card .progress-wrap{background:#e8edf3;border-radius:10px;height:14px;overflow:hidden;margin:4px 0;}
.goal-card .progress-bar{height:100%;border-radius:10px;transition:width .6s ease;}
.goal-card .nums{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;}
.month-table th{font-size:11px;padding:7px 8px;}
.month-table td{font-size:11px;padding:6px 8px;}
.month-confirmed{background:#eaf4fb;}
.month-current{background:#fef9e7;font-weight:700;}
.month-future{background:#f9f9f9;color:#aaa;}
.achievement-good{color:#27ae60;font-weight:700;}
.achievement-warn{color:#e67e22;font-weight:700;}
.achievement-bad{color:#e74c3c;font-weight:700;}
.no-data{text-align:center;padding:40px;color:var(--muted);font-size:14px;}
@media(max-width:600px){
  .chart-grid{grid-template-columns:1fr;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  header h1{font-size:13px;}
  .tabs{gap:2px;}
  .tab{padding:8px 10px;font-size:11px;}
}
</style>
</head>
<body>
<header>
  <h1>🦫 비버웍스 영업본부 | 매출현황 대시보드</h1>

<div class="upload-zone" onclick="document.getElementById('file-input').click()">

<div class="page" id="page-2"><div class="no-data">📂 파일 업로드 후 표시</div></div>
<div class="page" id="page-3"><div class="no-data">📂 파일 업로드 후 표시</div></div>
<div class="page" id="page-4"><div class="no-data">📂 파일 업로드 후 표시</div></div>
<div class="page" id="page-5"><div class="no-data">📂 파일 업로드 후 표시</div></div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════
// 상수 & 설정
// ═══════════════════════════════════════════════════════════
const MAIN_TEAMS = ['New Acquisition팀','전략영업팀','사업개발실'];
const TEAM_COLORS = {
  'New Acquisition팀':'#2980b9',
  '전략영업팀':'#e67e22',
  '사업개발실':'#27ae60',
};
const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

// ── 팀별 월간 목표 (원 단위) ── 출처: 26년 영업본부 팀별 목표_251218
// 사업개발실 = F&B영업 + 리테일영업 합산
const MONTHLY_TARGETS = {
  '사업개발실':         [808920000,779438000,939172000,1053597000,968852000,1018599000,1013835000,1059300000,1006868000,964599000,1005121000,775099000],
  '전략영업팀':         [303517000,322788000,1216886000,371490000,420477000,1192227000,449477000,403377000,1221127000,438377000,381277000,1236327000],
  'New Acquisition팀': [20000000,45000000,90000000,115000000,150000000,185000000,220000000,235000000,235000000,310000000,210000000,210000000],
  '영업본부 전체':      [1132437000,1147226000,2246058000,1540087000,1539329000,2395826000,1683312000,1697677000,2462995000,1712976000,1596398000,2221426000],
};

// ── 1~4월 확정 실적 (원 단위) ── 출처: 26년 목표 파일 실판매매출 기준 (천원×1000)
const CONFIRMED_ACTUALS = {
  '사업개발실':         [832500000,695589000,485188000,724225000,null,null,null,null,null,null,null,null],
  '전략영업팀':         [222381000,227071000,272174000,102230000,null,null,null,null,null,null,null,null],
  'New Acquisition팀': [54468000,12953000,44781000,56295000,null,null,null,null,null,null,null,null],
  '영업본부 전체':      [1109349000,934613000,835143000,882750000,null,null,null,null,null,null,null,null],
};

// 1~4월 확정 환산매술 실적 (원): F&B(행40)+리테일(행54) 합산, 천원x1000
const CONFIRMED_ACTUALS_C = {
  '사업개발실':         [75245000,64070000,60950000,161434000,null,null,null,null,null,null,null,null],
  '전략영업팀':         [3800000,9900000,13600000,8292000,null,null,null,null,null,null,null,null],
  'New Acquisition팀': [0,3600000,4500000,33876000,null,null,null,null,null,null,null,null],
  '영업본부 전체':      [79045000,77570000,79050000,203602000,null,null,null,null,null,null,null,null],
};

const G = { rows:[], charts:{}, uploadedMonth:null };

// ═══════════════════════════════════════════════════════════
// 유틸
// ═══════════════════════════════════════════════════════════
function fmt(n){ return n==null?'-':(Math.round(n)).toLocaleString('ko-KR'); }
function fmtW(n){ return fmt(n)+'원'; }
function fmtPct(r){ return r==null?'-':(r*100).toFixed(1)+'%'; }
function sumBy(arr,k){ return arr.reduce((s,r)=>s+(Number(r[k])||0),0); }
function groupBy(arr,k){
  const m={};
  arr.forEach(r=>{ const v=r[k]||'(미분류)'; if(!m[v])m[v]=[]; m[v].push(r); });
  return m;
}
function getTeamRows(t){ return G.rows.filter(r=>r.team===t); }

function achieveColor(rate){
  if(rate>=1) return 'achievement-good';
  if(rate>=0.7) return 'achievement-warn';
  return 'achievement-bad';
}

// ══════════════════════════════════════════════════════
// 파일 파싱
// ═══════════════════════════════════════════════════════════
function handleFile(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const wb = XLSX.read(e.target.result, {type:'binary'});
      G.rows = parseERPData(wb);
      if(G.rows.length===0){ alert('3개 팀(사업개발실/New Acquisition팀/전략영업팀) 데이터가 없습니다.'); return; }
      // 업로드된 파일의 월 감지
      const dates = G.rows.map(r=>r.dateStr).filter(Boolean);
      if(dates.length){
        const sample = dates[0]; // "2026/05/01"
        const parts = sample.split('/');
        G.uploadedMonth = parts.length>=2 ? parseInt(parts[1]) : null;
      }
      document.getElementById('file-status').textContent = `✅ ${file.name} 로드 완료 (3개팀 ${G.rows.length}건${G.uploadedMonth?' | '+G.uploadedMonth+'월 데이터':''})`;
      document.getElementById('hdr-info').textContent = file.name + (G.uploadedMonth?' | '+G.uploadedMonth+'월':'');
      Object.values(G.charts).forEach(c=>c&&c.destroy&&c.destroy());
      G.charts = {};
      renderAll();
    } catch(err){ alert('파일 파싱 오류: '+err.message); console.error(err); }
  };
  reader.readAsBinaryString(file);
}

function parseERPData(wb){
  const wsName = wb.SheetNames[0];
  const ws = wb.Sheets[wsName];
  const raw = XLSX.utils.sheet_to_json(ws,{header:1,defval:''});

  // 돠헬행 찾기 (상태 또는 인쇄 컬럼)
  let hdrRow = 1;
  for(let i=0;i<Math.min(6,raw.length);i++){
    const first = String(raw[i][0]||'').trim();
    if(first==='상태'||first==='인쇄'){ hdrRow=i; break; }
  }
  const headers = raw[hdrRow].map(h=>String(h||'').trim());
  // 중복 컬럼명은 첫 번째 등장을 사용 (담당자명, 부서명 각 2개씩 존재)
  const ci = {};
  headers.forEach((h,i)=>{ if(!(h in ci)) ci[h]=i; });

  // 새 포맷(5월~): 공급가액, 일자-No., 담당자명
  // 구 포맷(~4월): 매출액 합계, 날짜(추출), 사원(담당)명
  const isNewFmt = ci['공급가액']!==undefined;

  const result = [];
  for(let i=hdrRow+1;i<raw.length;i++){
    const row = raw[i];
    const team = String(row[ci['부서명']]||'').trim();
    if(!team||!MAIN_TEAMS.includes(team)) continue;

    let dateStr='', salesperson='', sales=0, converted=0, van=0, purchase=0, installment=0;

    if(isNewFmt){
      // 새 포맷
      const dateRaw = String(row[ci['일자-No.']]||'').trim();
      const datePart = dateRaw.split('-')[0]; // "26/05/01"
      dateStr = datePart ? '20'+datePart : '';
      salesperson = String(row[ci['담당자명']]||'').trim();
      sales = Number(row[ci['공급가액']]||0);
      converted = Number(row[ci['환산매출(구독/렌탈)']]||0);
      van = Number(row[ci['VAN/PG수익(24개월기준)']]||0);
      purchase = Number(row[ci['구매/투자합계']]||0);
      installment = Number(row[ci['할부금액(합계)']]||0);
    } else {
      // 구 포맷 (하위 호환)
      dateStr = String(row[ci['날짜(추출)']]||'').trim();
      salesperson = String(row[ci['사원(담당)명']]||'').trim();
      sales = Number(row[ci['매출액 합계']]||0);
      converted = Number(row[ci['환산 매출 (구독/렌탈)']]||0);
      van = Number(row[ci['VAN/PG수익 (24개월기준)']]||0);
      purchase = Number(row[ci['구매/투자합계']]||0);
      installment = 0;
    }

    // 예상수익 = 공급가액 + 환산매출 + VAN/PG - 구매비용
    const profit = sales + converted + van - purchase;
    const profitRate = (sales+converted) > 0 ? profit/(sales+converted) : 0;

    result.push({
      status: String(row[ci['상태']||ci['진행상태']]||'').trim(),
      dateStr, salesperson, team,
      customer: String(row[ci['거래처명']]||'').trim(),
      project: String(row[ci['프로젝트명']]||'').trim(),
      solution: String(row[ci['솔루션명']]||'').trim(),
      item: String(row[ci['품목명(규격)']]||row[ci['품목명(요약)']]||'').trim(),
      store: String(row[ci['매장 상호명']]||'').trim(),
      qty: Number(row[ci['수량']]||0),
      sales, converted, van, purchase, installment,
      profit, profitRate,
    });
  }
  return result;
}

// ═══════════════════════════════════════════════════════════
// 탭 전환
// ═══════════════════════════════════════════════════════════
function switchTab(i){
  document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));
  document.querySelectorAll('.page').forEach((p,idx)=>p.classList.toggle('active',idx===i));
}

function renderAll(){
  renderDashboard();
  renderGoalAchievement();
  renderTeamEmployee();
  renderProject();
  renderDailyWeekly();
  renderRawData();
}

// ═══════════════════════════════════════════════════════════
// PAGE 0: 분석 대시보드
// ═══════════════════════════════════════════════════════════
function renderDashboard(){
  const rows = G.rows;
  const totalS  = sumBy(rows,'sales');
  const totalC  = sumBy(rows,'converted');
  const totalV  = sumBy(rows,'van');
  const totalPur= sumBy(rows,'purchase');
  const totalIns= sumBy(rows,'installment');
  const totalProfit = sumBy(rows,'profit');
  const avgProfitRate = (totalS+totalC)>0 ? totalProfit/(totalS+totalC) : 0;
  const cnt = rows.length;

  let html=`
  <div class="legend-bar">
    <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>공급가액(매출액)</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>환산매출(구독/렌탈)</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--orange)"></div>VAN/PG 수익</div>
    <div class="legend-item"><div class="legend-dot" style="background:#16a085"></div>예상수익</div>
  </div>
  <div class="section-title">📌 전체 핵심 KPI (영업 3팀 합산)</div>
  <div class="kpi-grid">
    <div class="kpi-card blue"><div class="lbl">💰 공급가액 합계</div><div class="val">${fmt(totalS)}원</div><div class="sub">VAT 제외 매출</div></div>
    <div class="kpi-card green"><div class="lbl">🔄 환산매출 합계</div><div class="val">${fmt(totalC)}원</div><div class="sub">구독·렌탈 환산</div></div>
    <div class="kpi-card orange"><div class="lbl">📡 VAN/PG 수익</div><div class="val">${fmt(totalV)}원</div><div class="sub">24개월 기준</div></div>
    <div class="kpi-card red"><div class="lbl">🛒 구매/투자 합계</div><div class="val">${fmt(totalPur)}원</div><div class="sub">원가 합계</div></div>
    <div class="kpi-card teal"><div class="lbl">📈 예상수익</div><div class="val">${fmt(totalProfit)}원</div><div class="sub">합계+VAN-구매 / ${fmtPct(avgProfitRate)}</div></div>
    <div class="kpi-card"><div class="lbl">💳 할부금액 합계</div><div class="val">${fmt(totalIns)}원</div><div class="sub">할부 매출</div></div>
    <div class="kpi-card"><div class="lbl">📦 총 계약 건수</div><div class="val">${cnt.toLocaleString()}건</div><div class="sub">영업 3팀</div></div>
  </div>

  <div class="section-title">① 영업 3팀 핵심실적 비교</div>
  <div class="kpi-grid">`;

  MAIN_TEAMS.forEach(team=>{
    const tr=getTeamRows(team);
    const s=sumBy(tr,'sales'),c=sumBy(tr,'converted'),v=sumBy(tr,'van'),pur=sumBy(tr,'purchase');
    const p=s+c+v-pur; const pr=(s+c)>0?p/(s+c):0;
    html+=`<div class="kpi-card" style="border-left-color:${TEAM_COLORS[team]}">
      <div class="lbl" style="color:${TEAM_COLORS[team]}">${team} (${tr.length}건)</div>
      <div class="val" style="font-size:15px">${fmt(s)}원</div><div class="sub">공급가액</div>
      <div style="color:var(--green);font-weight:700;margin-top:4px">${fmt(c)}원</div><div class="sub">환산매출 / VAN: ${fmt(v)}원</div>
      <div style="color:#16a085;font-weight:700;margin-top:4px">${fmt(p)}원</div><div class="sub">예상수익 (${fmtPct(pr)})</div>
    </div>`;
  });
  html+=`</div>

  <div class="section-title">② 팀별 매출 차트</div>
  <div class="chart-grid">
    <div class="chart-card"><h3>팀별 공급가액 vs 환산매출 (영업 3팀)</h3><canvas id="ch-team-bar"></canvas></div>
    <div class="chart-card"><h3>매출 구성 비율</h3><canvas id="ch-pie"></canvas></div>
  </div>
  <div class="chart-grid">
    <div class="chart-card"><h3>솔루션별 공급가액</h3><canvas id="ch-solution"></canvas></div>
    <div class="chart-card"><h3>진행상태별 건수</h3><canvas id="ch-status"></canvas></div>
  </div>`;

  // 진행상태별 현황
  html+=`<div class="section-title">③ 진행상태별 현황</div>
  <div class="table-wrap"><table>
    <tr><th>진행상태</th><th class="blue-hdr">공급가액</th><th class="green-hdr">환산매출</th><th>합계</th><th>VAN/PG</th><th>구매비용</th><th>예상수익</th><th>건수</th></tr>`;
  const byStatus=groupBy(rows,'status');
  ['미확인','불출 중','불출 완료','설치 완료'].forEach(st=>{
    const sr=byStatus[st]||[]; if(!sr.length) return;
    const sS=sumBy(sr,'sales'),sC=sumBy(sr,'converted'),sV=sumBy(sr,'van'),sP=sumBy(sr,'purchase');
    html+=`<tr><td class="text-center"><span class="badge badge-${st.replace(/ /g,'')}">${st}</span></td>
      <td class="num">${fmt(sS)}</td><td class="num">${fmt(sC)}</td><td class="num">${fmt(sS+sC)}</td>
      <td class="num">${fmt(sM)}</td><td class="num">${fmt(sP)}</td>
      <td class="num">${fmt(sS+sC+sV-sP)}</td><td class="text-center">${sr.length}</td></tr>`;
  });
  html+=`<tr class="total"><td class="text-center">합 계</td>
    <td class="num">${fmt(totalS)}</td><td class="num">${fmt(totalC)}</td><td class="num">${fmt(totalS+totalC)}</td>
    <td class="num">${fmt(totalV)}</td><td class="num">${fmt(totalPur)}</td>
    <td class="num">${fmt(totalProfit)}</td><td class="text-center">${cnt}</td>
  </tr></table></div>

  <div class="section-title">④ 솔루션별 현황</div>
  <div class="table-wrap"><table>
    <tr><th>솔루션명</th><th>팀명</th><th class="blue-hdr">공급가액</th><th class="green-hdr">환산매출</th><th>합계</th><th>예상수익</th><th>건수</th></tr>`;
  const bySolution=groupBy(rows,'solution');
  Object.entries(bySolution).sort((a,b)=>sumBy(b[1],'sales')-sumBy(a[1],'sales')).forEach(([sol,sr])=>{
    const teams=[...new Set(sr.map(r=>r.team))].join(', ');
    const sS=sumBy(sr,'sales'),sC=sumBy(sr,'converted'),sV=sumBy(sr,'van'),sP=sumBy(sr,'purchase');
    html+=`<tr><td>${sol||'(미지정)'}</td><td>${teams}</td>
      <td class="num">${fmt(sS)}</td><td class="num">${fmt(sC)}</td><td class="num">${fmt(sS+sC)}</td>
      <td class="num">${fmt(sS+sC+sV-sP)}</td><td class="text-center">${sr.length}</td></tr>`;
  });
  html+=`</table></div>`;

  document.getElementById('page-0').innerHTML=html;

  setTimeout(()=>{
    // 팀별 바차트
    G.charts.teamBar=new Chart(document.getElementById('ch-team-bar'),{
      type:'bar',
      data:{
        labels:MAIN_TEAMS,
        datasets:[
          {label:'공급가액',data:MAIN_TEAMS.map(t=>sumBy(getTeamRows(t),'sales')),backgroundColor:'#2980b9cc',borderColor:'#2980b9',borderWidth:1},
          {label:'환산매출',data:MAIN_TEAMS.map(t=>sumBy(getTeamRows(t),'converted')),backgroundColor:'#27ae60cc',borderColor:'#27ae60',borderWidth:1},
        ]
      },
      options:{responsive:true,plugins:{legend:{position:'top'}},scales:{y:{ticks:{callback:v=>(v/10000).toFixed(0)+'만'}}}}
    });
    // 파이
    G.charts.pie=new Chart(document.getElementById('ch-pie'),{
      type:'doughnut',
      data:{
        labels:['공급가액','환산매출','VAN/PG수익'],
        datasets:[{data:[totalS,totalC,totalV],backgroundColor:['#2980b9','#27ae60','#e67e22']}]
      },
      options:{responsive:true,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:ctx=>ctx.label+': '+fmt(ctx.raw)+'원'}}}}
    });
    // 솔루션별
    const solEntries=Object.entries(groupBy(rows,'solution')).sort((a,b)=>sumBy(b[1],'sales')-sumBy(a[1],'sales')).slice(0,8);
    G.charts.solution=new Chart(document.getElementById('ch-solution'),{
      type:'bar',
      data:{
        labels:solEntries.map(([s])=>s||'기타'),
        datasets:[{label:'공급가액',data:solEntries.map(([,r])=>sumBy(r,'sales')),backgroundColor:'#16a085cc'}]
      },
      options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{callback:v=>(v/10000).toFixed(0)+'만'}}}}
    });
    // 상태별
    const statusG=groupBy(rows,'status');
    G.charts.status=new Chart(document.getElementById('ch-status'),{
      type:'pie',
      data:{
        labels:Object.keys(statusG),
        datasets:[{data:Object.values(statusG).map(r=>r.length),backgroundColor:['#f39c12','#2980b9','#27ae60','#8e44ad']}]
      },
      options:{responsive:true,plugins:{legend:{position:'bottom'}}}
    });
  },50);
}

// PAGE 1: 목표 대비 달성율
// ═══════════════════════════════════════════════════════════
function renderGoalAchievement(){
  const curMon = G.uploadedMonth; // 1-12, null if not detected

  // 현재 업로드 월 실적 계산 (공급가액 + 환산매출 분리)
  const curActuals = {}, curActualsC = {};
  if(curMon){
    MAIN_TEAMS.forEach(t=>{
      curActuals[t]  = sumBy(getTeamRows(t),'sales');
      curActualsC[t] = sumBy(getTeamRows(t),'converted');
    });
    curActuals['영업본부 전체']  = Object.values(curActuals).reduce((s,v)=>s+v,0);
    curActualsC['영업본부 전체'] = Object.values(curActualsC).reduce((s,v)=>s+v,0);
  }

  // 각 팀·월 실적 취합 (confirmed + current)
  function getActual(team, monthIdx){
    const confirmed = CONFIRMED_ACTUALS[team]?.[monthIdx];
    if(confirmed!=null) return confirmed;
    if(curMon && monthIdx===curMon-1) return curActuals[team]||null;
    return null;
  }

  // ── 이번 달 달성율 게이지 ──
  function getActualC(team, monthIdx){
    const confirmed = CONFIRMED_ACTUALS_C[team]?.[monthIdx];
    if(confirmed!=null) return confirmed;
    if(curMon && monthIdx===curMon-1) return curActualsC[team]||null;
    return null;
  }

  const displayMon = curMon || 5;
  let html=`
  <div class="section-title">🎯 ${displayMon}월 팀별 목표 달성율 현황</div>
  <div class="goal-grid">`;

  [...MAIN_TEAMS,'영업본부 전체'].forEach(team=>{
    const target = MONTHLY_TARGETS[team]?.[displayMon-1]||0;
    const actS = curMon ? (curActuals[team]||0) : null;
    const actC = getActualC(team, displayMon-1) || 0;
    const actTotal = actS!=null ? actS+actC : null;
    const rate1 = (actS!=null&&target>0) ? actS/target : null;
    const rate2 = (actTotal!=null&&target>0) ? actTotal/target : null;
    const color2 = rate2==null?'#95a5a6':rate2>=1?'#27ae60':rate2>=0.7?'#e67e22':'#e74c3c';
    const teamColor = TEAM_COLORS[team]||'#1a3c5e';
    html+=`<div class="goal-card">
      <div class="team-name" style="color:${teamColor}">${team}</div>
      <div style="font-size:11px;color:#7f8c8d;margin-bottom:4px">목표: ${fmt(target)}원</div>
      ${actS!=null?`<div style="font-size:11px;margin-bottom:2px">실매출: <b>${fmt(actS)}원</b> <span style="color:${rate1>=1?'#27ae60':rate1>=0.7?'#e67e22':'#e74c3c'};font-weight:700">(${fmtPct(rate1)})</span></div>`:''}
      ${actC?`<div style="font-size:11px;color:#27ae60;margin-bottom:2px">환산매출: ${fmt(actC)}원</div>`:''}
      <div class="progress-wrap"><div class="progress-bar" style="width:${rate2!=null?Math.min(rate2*100,100):0}%;background:${color2}"></div></div>
      <div class="nums">
        <span>합계: ${actTotal!=null?fmt(actTotal)+'원':'파일 업로드 필요'}</span>
        <span style="color:${color2};font-weight:700">${rate2!=null?fmtPct(rate2):'-%'}</span>
      </div>
    </div>`;
  });
  html+=`</div>`;

  // ── 연간 월별 목표 vs 실적 테이블 ──
  html+=`<div class="section-title">📊 2026년 연간 목표 대비 실적 현황 (단위: 원)</div>`;

  [...MAIN_TEAMS,'영업본부 전체'].forEach(team=>{
    const teamColor = TEAM_COLORS[team]||'#1a3c5e';
    html+=`<div style="margin-bottom:16px">
    <div style="font-weight:700;color:${teamColor};margin-bottom:6px;font-size:13px">${team}</div>
    <div class="table-wrap"><table class="month-table">
      <tr><th>구분</th>`;
    MONTHS.forEach(m=>html+=`<th>${m}</th>`);
    html+=`<th>합계</th></tr>

      <tr><td style="font-weight:600">목표</td>`;
    let targetTotal=0;
    MONTHS.forEach((_,mi)=>{
      const t=MONTHLY_TARGETS[team]?.[mi]||0; targetTotal+=t;
      html+=`<td class="num">${fmt(t)}</td>`;
    });
    html+=`<td class="num" style="font-weight:700">${fmt(targetTotal)}</td></tr>

      <tr><td style="font-weight:600;color:#2980b9">① 실매출액</td>`;
    let actualTotal=0;
    MONTHS.forEach((_,mi)=>{
      const a=getActual(team,mi);
      if(a!=null) actualTotal+=a;
      const isConfirmed = CONFIRMED_ACTUALS[team]?.[mi]!=null || CONFIRMED_ACTUALS_C[team]?.[mi]!=null;
      const isCurrent = curMon && mi===curMon-1;
      const cls = isConfirmed?'month-confirmed':isCurrent?'month-current':'month-future';
      html+=`<td class="num ${cls}">${a!=null?fmt(a):'-'}</td>`;
    });
    html+=`<td class="num" style="font-weight:700">${actualTotal>0?fmt(actualTotal):'-'}</td></tr>

      <tr><td style="font-weight:600;color:#2980b9">달성율①</td>`;
    MONTHS.forEach((_,mi)=>{
      const t=MONTHLY_TARGETS[team]?.[mi]||0;
      const a=getActual(team,mi);
      const rate = (a!=null&&t>0)?a/t:null;
      const cls = rate==null?'':achieveColor(rate);
      const isConfirmed = CONFIRMED_ACTUALS[team]?.[mi]!=null || CONFIRMED_ACTUALS_C[team]?.[mi]!=null;
      const isCurrent = curMon && mi===curMon-1;
      const bgCls = isConfirmed?'month-confirmed':isCurrent?'month-current':'month-future';
      html+=`<td class="text-center ${bgCls}"><span class="${cls}">${rate!=null?fmtPct(rate):'-'}</span></td>`;
    });
    html+=`<td></td></tr>

      <tr><td style="font-weight:600;color:#27ae60">환산매출</td>`;
    MONTHS.forEach((_,mi)=>{
      // 환산매출: 현재달만 업로드 데이터에서, 과거는 데이터 없음
      const isCurrent = curMon && mi===curMon-1;
      const c = getActualC(team,mi);
      const bgCls = (CONFIRMED_ACTUALS_C[team]?.[mi]!=null)?'month-confirmed':isCurrent?'month-current':'month-future';
      html+=`<td class="num ${bgCls}">${c!=null&&c>0?fmt(c):'-'}</td>`;
    });
    html+=`<td class="num">${curMon?(curActualsC[team]||0)>0?fmt(curActualsC[team]||0):'-':'-'}</td></tr>

      <tr><td style="font-weight:600;color:#8e44ad">② 실매출+환산</td>`;
    MONTHS.forEach((_,mi)=>{
      const t=MONTHLY_TARGETS[team]?.[mi]||0;
      const a=getActual(team,mi);
      const isCurrent = curMon && mi===curMon-1;
      const c = getActualC(team,mi)||0;
      const total = a!=null ? a+c : (c>0?c:null);
      const isConfirmed = CONFIRMED_ACTUALS[team]?.[mi]!=null || CONFIRMED_ACTUALS_C[team]?.[mi]!=null;
      const bgCls = isConfirmed?'month-confirmed':isCurrent?'month-current':'month-future';
      html+=`<td class="num ${bgCls}">${total!=null?fmt(total):'-'}</td>`;
    });
    html+=`<td></td></tr>

      <tr><td style="font-weight:600;color:#8e44ad">달성율②</td>`;
    MONTHS.forEach((_,mi)=>{
      const t=MONTHLY_TARGETS[team]?.[mi]||0;
      const a=getActual(team,mi);
      const isCurrent = curMon && mi===curMon-1;
      const c = getActualC(team,mi)||0;
      const total = a!=null ? a+c : (c>0?c:null);
      const rate2 = (total!=null&&t>0)?total/t:null;
      const cls2 = rate2==null?'':achieveColor(rate2);
      const isConfirmed = CONFIRMED_ACTUALS[team]?.[mi]!=null || CONFIRMED_ACTUALS_C[team]?.[mi]!=null;
      const bgCls = isConfirmed?'month-confirmed':isCurrent?'month-current':'month-future';
      html+=`<td class="text-center ${bgCls}"><span class="${cls2}">${rate2!=null?fmtPct(rate2):'-'}</span></td>`;
    });
    html+=`<td></td></tr>
    </table></div></div>`;
  });

  // ── 달성율 차트 ──
  html+=`<div class="section-title">📈 월별 달성율 추이 (확정 실적 기준)</div>
  <div class="chart-card"><canvas id="ch-goal-line" style="max-height:280px"></canvas></div>`;

  document.getElementById('page-1').innerHTML=html;

  setTimeout(()=>{
    const confirmedMonths = MONTHS.slice(0,4); // 1-4월 confirmed
    const datasets = MAIN_TEAMS.map(team=>({
      label:team,
      data:MONTHS.map((_,mi)=>{
        const t=MONTHLY_TARGETS[team]?.[mi];
        const a=getActual(team,mi);
        return (a!=null&&t)?Math.round(a/t*100):null;
      }),
      borderColor:TEAM_COLORS[team],
      backgroundColor:TEAM_COLORS[team]+'33',
      tension:0.3,pointRadius:5,fill:false,spanGaps:true,
    }));
    G.charts.goalLine=new Chart(document.getElementById('ch-goal-line'),{
      type:'line',
      data:{labels:MONTHS,datasets},
      options:{
        responsive:true,
        plugins:{legend:{position:'top'},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+ctx.parsed.y+'%'}}},
        scales:{y:{ticks:{callback:v=>v+'%'},suggestedMin:0,suggestedMax:150},
                x:{grid:{color:'#eee'}}},
      }
    });
  },50);
}

// PAGE 2: 팀·사원별 실적
// ═══════════════════════════════════════════════════════════
function renderTeamEmployee(){
  const rows=G.rows;
  const byTeam=groupBy(rows,'team');
  const teamOrder=MAIN_TEAMS.filter(t=>byTeam[t]);
  let html=`
  <div class="legend-bar">
    <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>공급가액</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>환산매출</div>
    <div class="legend-item"><div class="legend-dot" style="background:#16a085"></div>예상수익</div>
  </div>
  <div class="section-title">📋 팀·사원별 매출 실적</div>
  <div class="table-wrap"><table>
    <tr><th>팀명</th><th>사원명(담당자)</th><th>건수</th>
    <th class="blue-hdr">공급가액</th><th class="green-hdr">환산매출</th><th>합계</th>
    <th>VAN/PG</th><th>구매비용</th><th>예상수익</th><th>수익률</th></tr>`;

  let gS=0,gC=0,gV=0,gPur=0,gP=0,gCnt=0;
  teamOrder.forEach(team=>{
    const tr=byTeam[team]||[]; if(!tr.length) return;
    const byP=groupBy(tr,'salesperson');
    const tS=sumBy(tr,'sales'),tC=sumBy(tr,'converted'),tV=sumBy(tr,'van');
    const tPur=sumBy(tr,'purchase'),tP=sumBy(tr,'profit');
    const tPR=(tS+tC)>0?tP/(tS+tC):0;
    gS+=tS;gC+=tC;gV+=tV;gPur+=tPur;gP+=tP;gCnt+=tr.length;
    html+=`<tr class="subtotal" style="background:${TEAM_COLORS[team]}22">
      <td style="font-weight:700;color:${TEAM_COLORS[team]}">${team}</td>
      <td class="text-center">소계</td><td class="text-center">${tr.length}</td>
      <td class="num">${fmt(tS)}</td><td class="num">${fmt(tC)}</td><td class="num">${fmt(tS+tC)}</td>
      <td class="num">${fmt(tV)}</td><td class="num">${fmt(tPur)}</td>
      <td class="num">${fmt(tP)}</td><td class="text-center">${fmtPct(tPR)}</td>
    </tr>`;
    Object.entries(byP).sort((a,b)=>sumBy(b[1],'sales')+sumBy(b[1],'converted')-(sumBy(a[1],'sales')+sumBy(a[1],'converted'))).forEach(([person,pr])=>{
      if(!person) return;
      const pS=sumBy(pr,'sales'),pC=sumBy(pr,'converted'),pV=sumBy(pr,'van'),pPur=sumBy(pr,'purchase'),pP=sumBy(pr,'profit');
      const pPR=(pS+pC)>0?pP/(pS+pC):0;
      html+=`<tr><td></td><td class="text-left" style="color:${TEAM_COLORS[team]}">&nbsp;&nbsp;↳ ${person}</td>
        <td class="text-center">${pr.length}</td>
        <td class="num">${fmt(pS)}</td><td class="num">${fmt(pC)}</td><td class="num">${fmt(pS+pC)}</td>
        <td class="num">${fmt(pV)}</td><td class="num">${fmt(pPur)}</td>
        <td class="num">${fmt(pP)}</td><td class="text-center">${fmtPct(pPR)}</td></tr>`;
    });
  });
  const gPR=(gS+gC)>0?gP/(gS+gC):0;
  html+=`<tr class="total"><td colspan="2" class="text-center">총 합계</td><td class="text-center">${gCnt}</td>
    <td class="num">${fmt(gS)}</td><td class="num">${fmt(gC)}</td><td class="num">${fmt(gS+gC)}</td>
    <td class="num">${fmt(gV)}</td><td class="num">${fmt(gPur)}</td><td class="num">${fmt(gP)}</td><td class="text-center">${fmtPct(gPR)}</td>
  </tr></table></div>
  <div class="section-title">사원별 공급가액 (상위 15명)</div>
  <div class="chart-card"><canvas id="ch-person-bar" style="max-height:320px"></canvas></div>`;

  document.getElementById('page-2').innerHTML=html;
  setTimeout(()=>{
    const byPerson=groupBy(rows,'salesperson');
    const sorted=Object.entries(byPerson).map(([p,r])=>({name:p,s:sumBy(r,'sales'),c:sumBy(r,'converted')}))
      .sort((a,b)=>(b.s+b.c)-(a.s+a.c)).slice(0,15);
    G.charts.personBar=new Chart(document.getElementById('ch-person-bar'),{
      type:'bar',
      data:{labels:sorted.map(x=>x.name),datasets:[
        {label:'공급가액',data:sorted.map(x=>x.s),backgroundColor:'#2980b9cc'},
        {label:'환산매출',data:sorted.map(x=>x.c),backgroundColor:'#27ae60cc'},
      ]},
      options:{responsive:true,plugins:{legend:{position:'top'}},scales:{y:{ticks:{callback:v=>(v/10000).toFixed(0)+'만'}}}}
    });
  },50);
}

// ═══════════════════════════════════════════════════════════
// PAGE 3: 프로젝트현황
// ═══════════════════════════════════════════════════════════
function renderProject(){
  const rows=G.rows;
  const byProj=groupBy(rows,'project');
  const sorted=Object.entries(byProj).map(([p,r])=>({
    project:p,team:r[0].team,cnt:r.length,
    s:sumBy(r,'sales'),c:sumBy(r,'converted'),v:sumBy(r,'van'),
    pur:sumBy(r,'purchase'),p:sumBy(r,'profit')
  })).sort((a,b)=>(b.s+b.c)-(a.s+a.c));

  let html=`
  <div class="filter-bar">
    <label>팀 필터:</label>
    <select id="proj-team-filter" onchange="filterProjTable()">
      <option value="">전체</option>
      ${[...new Set(rows.map(r=>r.team))].map(t=>`<option>${t}</option>`).join('')}
    </select>
  </div>
  <div class="section-title">🗂️ 프로젝트(협력사)별 매출현황</div>
  <div class="table-wrap"><table id="proj-table">
    <tr><th>No.</th><th>팀명</th><th>프로젝트명</th><th>건수</th>
    <th class="blue-hdr">공급가액</th><th class="green-hdr">환산매출</th>
    <th>합계</th><th>VAN/PG</th><th>구매비용</th><th>예상수익</th><th>수익률</th></tr>`;

  let no=1;
  sorted.forEach(x=>{
    const pr=(x.s+x.c)>0?x.p/(x.s+x.c):0;
    html+=`<tr data-team="${x.team}">
      <td class="text-center">${no++}</td><td style="color:${TEAM_COLORS[x.team]||''};font-weight:600">${x.team}</td>
      <td>${x.project}</td><td class="text-center">${x.cnt}</td>
      <td class="num">${fmt(x.s)}</td><td class="num">${fmt(x.c)}</td><td class="num">${fmt(x.s+x.c)}</td>
      <td class="num">${fmt(x.v)}</td><td class="num">${fmt(x.pur)}</td>
      <td class="num">${fmt(x.p)}</td><td class="text-center">${fmtPct(pr)}</td>
    </tr>`;
  });
  const totS=sumBy(rows,'sales'),totC=sumBy(rows,'converted'),totV=sumBy(rows,'van'),totPur=sumBy(rows,'purchase'),totP=sumBy(rows,'profit');
  const totPR=(totS+totC)>0?totP/(totS+totC):0;
  html+=`<tr class="total"><td colspan="3" class="text-center">합 계</td>
    <td class="text-center">${rows.length}</td>
    <td class="num">${fmt(totS)}</td><td class="num">${fmt(totC)}</td>
    <td class="num">${fmt(totS+totC)}</td>
    <td class="num">${fmt(totV)}</td><td class="num">${fmt(totPur)}</td>
    <td class="num">${fmt(totP)}</td><td class="text-center">${fmtPct(totPR)}</td>
  </tr></table></div>
  <div class="section-title">프로젝트 규모 차트 (상위 15개)</div>
  <div class="chart-card"><canvas id="ch-proj-bar" style="max-height:320px"></canvas></div>`;

  document.getElementById('page-3').innerHTML=html;
  setTimeout(()=>{
    const top15=sorted.slice(0,15);
    G.charts.projBar=new Chart(document.getElementById('ch-proj-bar'),{
      type:'bar',
      data:{
        labels:top15.map(x=>x.project.length>16?x.project.slice(0,16)+'…':x.project),
        datasets:[
          {label:'공급가액',data:top15.map(x=>x.s),backgroundColor:'#2980b9cc'},
          {label:'환산매출',data:top15.map(x=>x.c),backgroundColor:'#27ae60cc'},
        ]
      },
      options:{indexAxis:'y',responsive:true,plugins:{legend:{position:'top'}},scales:{x:{ticks:{callback:v=>(v/10000).toFixed(0)+'만'}}}}
    });
  },50);
}

function filterProjTable(){
  const val=document.getElementById('proj-team-filter').value;
  document.querySelectorAll('#proj-table tr[data-team]').forEach(r=>{
    r.style.display=(!val||r.dataset.team===val)?'':'none';
  });
}

// ═══════════════════════════════════════════════════════════
// PAGE 4: 일별·주간현황
// ═══════════════════════════════════════════════════════════
function renderDailyWeekly(){
  const rows=G.rows.filter(r=>r.dateStr);
  const byDate=groupBy(rows,'dateStr');
  const sortedDates=Object.keys(byDate).sort();

  function getWeek(d){ const day=new Date(d.replace(/\//g,'-')).getDate(); return `${Math.ceil(day/7)}주차`; }
  function getDow(d){ return ['일','월','화','수','목','금','토'][new Date(d.replace(/\//g,'-')).getDay()]||''; }

  const dailyData=sortedDates.map(date=>{
    const dr=byDate[date];
    const teamS={};
    MAIN_TEAMS.forEach(t=>{teamS[t]={s:0,c:0};});
    dr.forEach(r=>{ if(teamS[r.team]){teamS[r.team].s+=r.sales;teamS[r.team].c+=r.converted;} });
    return {date,week:getWeek(date),day:getDow(date),cnt:dr.length,
      s:sumBy(dr,'sales'),c:sumBy(dr,'converted'),v:sumBy(dr,'van'),p:sumBy(dr,'profit'),teams:teamS};
  });

  const na='New Acquisition팀', st='전략영업팀', bd='사업개발실';
  let html=`
  <div class="section-title">📅 일별 매출현황</div>
  <div class="table-wrap"><table>
    <tr><th>날짜</th><th>주차</th><th>요일</th><th>건수</th>
    <th class="blue-hdr">공급가액</th><th class="green-hdr">환산매출</th><th>VAN/PG</th><th>예상수익</th>
    <th style="background:#2980b9">NA팀 매출</th><th style="background:#16a085">NA팀 환산</th>
    <th style="background:#e67e22">전략팀 매출</th><th style="background:#c0392b">전략팀 환산</th>
    <th style="background:#27ae60">사업개발 매출</th><th style="background:#1abc9c">사업개발 환산</th>
    </tr>`;

  let totS=0,totC=0,totV=0,totP=0;
  dailyData.forEach(d=>{
    totS+=d.s;totC+=d.c;totV+=d.v;totP+=d.p;
    html+=`<tr>
      <td class="text-center">${d.date}</td><td class="text-center">${d.week}</td>
      <td class="text-center">${d.day}</td><td class="text-center">${d.cnt}</td>
      <td class="num">${fmt(d.s)}</td><td class="num">${fmt(d.c)}</td>
      <td class="num">${fmt(d.v)}</td><td class="num">${fmt(d.p)}</td>
      <td class="num">${fmt(d.teams[na].s)}</td><td class="num">${fmt(d.teams[na].c)}</td>
      <td class="num">${fmt(d.teams[st].s)}</td><td class="num">${fmt(d.teams[st].c)}</td>
      <td class="num">${fmt(d.teams[bd].s)}</td><td class="num">${fmt(d.teams[bd].c)}</td>
    </tr>`;
  });
  html+=`<tr class="total"><td colspan="3" class="text-center">합 계</td>
    <td class="text-center">${rows.length}</td>
    <td class="num">${fmt(totS)}</td><td class="num">${fmt(totC)}</td>
    <td class="num">${fmt(totV)}</td><td class="num">${fmt(totP)}</td>
    <td colspan="6"></td></tr></table></div>

  <div class="section-title">📅 주차별 매출현황</div>
  <div class="table-wrap"><table>
    <tr><th>주차</th><th>기간</th><th>건수</th>
    <th class="blue-hdr">공급가액</th><th class="green-hdr">환산매출</th>
    <th>합계</th><th>VAN/PG</th><th>예상수익</th></tr>`;

  const byWeek={};
  dailyData.forEach(d=>{ if(!byWeek[d.week])byWeek[d.week]=[]; byWeek[d.week].push(d); });
  Object.entries(byWeek).sort().forEach(([wk,days])=>{
    const dates=days.map(d=>d.date).sort();
    const period=dates.length>1?`${dates[0]} ~ ${dates[dates.length-1]}`:dates[0];
    const wS=days.reduce((s,d)=>s+d.s,0),wC=days.reduce((s,d)=>s+d.c,0);
    const wV=days.reduce((s,d)=>s+d.v,0),wP=days.reduce((s,d)=>s+d.p,0),wCnt=days.reduce((s,d)=>s+d.cnt,0);
    html+=`<tr class="subtotal"><td class="text-center">${wk}</td><td class="text-center">${period}</td>
      <td class="text-center">${wCnt}</td>
      <td class="num">${fmt(wS)}</td><td class="num">${fmt(wC)}</td><td class="num">${fmt(wS+wC)}</td>
      <td class="num">${fmt(wV)}</td><td class="num">${fmt(wP)}</td></tr>`;
  });
  html+=`<tr class="total"><td colspan="2" class="text-center">합 계</td>
    <td class="text-center">${rows.length}</td>
    <td class="num">${fmt(totS)}</td><td class="num">${fmt(totC)}</td><td class="num">${fmt(totS+totC)}</td>
    <td class="num">${fmt(totV)}</td><td class="num">${fmt(totP)}</td>
  </tr></table></div>

  <div class="section-title">일별 매출 추이</div>
  <div class="chart-card"><canvas id="ch-daily-line" style="max-height:280px"></canvas></div>`;

  document.getElementById('page-4').innerHTML=html;
  setTimeout(()=>{
    G.charts.dailyLine=new Chart(document.getElementById('ch-daily-line'),{
      type:'line',
      data:{
        labels:dailyData.map(d=>d.date),
        datasets:[
          {label:'공급가액',data:dailyData.map(d=>d.s),borderColor:'#2980b9',backgroundColor:'#2980b920',fill:true,tension:0.3,pointRadius:4},
          {label:'환산매출',data:dailyData.map(d=>d.c),borderColor:'#27ae60',backgroundColor:'#27ae6020',fill:true,tension:0.3,pointRadius:4},
        ]
      },
      options:{responsive:true,plugins:{legend:{position:'top'}},scales:{y:{ticks:{callback:v=>(v/10000).toFixed(0)+'만'}}}}
    });
  },50);
}

// ═══════════════════════════════════════════════════════════
// PAGE 5: 원본데이터
// ═══════════════════════════════════════════════════════════
function renderRawData(){
  const rows=G.rows;
  let html=`
  <div class="filter-bar">
    <label>검색:</label>
    <input type="text" id="raw-search" placeholder="팀명/담당자/거래처/프로젝트 검색..." oninput="filterRaw(this.value)" style="width:220px">
    <label>팀:</label>
    <select id="raw-team" onchange="filterRaw(document.getElementById('raw-search').value)">
      <option value="">전체</option>
      ${[...new Set(rows.map(r=>r.team))].sort().map(t=>`<option>${t}</option>`).join('')}
    </select>
    <span id="raw-cnt" style="font-size:11px;color:var(--muted)">총 ${rows.length}건</span>
  </div>
  <div class="table-wrap" style="max-height:600px;overflow-y:auto"><table id="raw-table">
    <tr><th>상태</th><th>날짜</th><th>부서명</th><th>담당자</th><th>거래처명</th>
    <th>프로젝트명</th><th>솔루션명</th><th>품목명</th>
    <th class="blue-hdr">공급가액</th><th class="green-hdr">환산매출</th>
    <th>할부금액</th><th>VAN/PG</th><th>구매비용</th><th>예상수익</th><th>수익률</th></tr>`;

  rows.forEach(r=>{
    const c=TEAM_COLORS[r.team]||'#555';
    html+=`<tr data-team="${r.team}" data-text="${[r.team,r.salesperson,r.customer,r.project].join(' ').toLowerCase()}">
      <td class="text-center"><span class="badge badge-${r.status.replace(/ /g,'')}">${r.status}</span></td>
      <td class="text-center">${r.dateStr}</td>
      <td style="color:${c};font-weight:600">${r.team}</td>
      <td>${r.salesperson}</td><td>${r.customer}</td><td>${r.project}</td>
      <td>${r.solution}</td><td style="max-width:150px;overflow:hidden;white-space:nowrap" title="${r.item}">${r.item}</td>
      <td class="num">${fmt(r.sales)}</td><td class="num">${fmt(r.converted)}</td>
      <td class="num">${fmt(r.installment)}</td><td class="num">${fmt(r.van)}</td>
      <td class="num">${fmt(r.purchase)}</td><td class="num">${fmt(r.profit)}</td>
      <td class="text-center">${fmtPct(r.profitRate)}</td>
    </tr>`;
  });
  html+=`</table></div>`;
  document.getElementById('page-5').innerHTML=html;
}

function filterRaw(search){
  const team=document.getElementById('raw-team').value;
  const q=search.toLowerCase();
  let cnt=0;
  document.querySelectorAll('#raw-table tr[data-team]').forEach(row=>{
    const matchTeam=!team||row.dataset.team===team;
    const matchSearch=!q||row.dataset.text.includes(q);
    const show=matchTeam&&matchSearch;
    row.style.display=show?'':'none';
    if(show) cnt++;
  });
  const el=document.getElementById('raw-cnt');
  if(el) el.textContent=`${cnt}건 표시`;
}
</script>
</body>
</html>
